<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hangouts</title>
<meta name="description" content="Plan dates, find days we're both free, and keep the memories.">
<meta name="theme-color" content="#fff5f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hangouts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" integrity="sha384-sPwMflxqfAN+Q5mvlkLmHiX3PORGbZSXHiSGPTXT9VHCD/AB+b+r+vJWsqprv+7k" crossorigin="anonymous" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>

<div id="lock" class="overlay lock" hidden>
  <form class="lock-card" id="lockForm">
    <div class="lock-icon" aria-hidden="true">💌</div>
    <h1>Welcome back</h1>
    <p class="muted">Enter the passphrase you two share.</p>
    <input type="password" id="lockPass" autocomplete="current-password" placeholder="Passphrase" required>
    <button class="btn primary" type="submit">Open</button>
    <p class="err" id="lockErr" role="alert"></p>
    <button class="linkish" type="button" id="lockSkip">Use without syncing</button>
  </form>
</div>

<header class="topbar">
  <a class="brand" href="#ask"><span class="heart">❤</span> hangouts</a>
  <nav class="tabs" aria-label="Sections">
    <a class="tab" href="#ask" data-tab="ask" title="Ask">💌 <span>Ask</span></a>
    <a class="tab" href="#calendar" data-tab="calendar" title="Calendar">📅 <span>Calendar</span></a>
    <a class="tab" href="#plans" data-tab="plans" title="Plans">✨ <span>Plans</span></a>
    <a class="tab" href="#ideas" data-tab="ideas" title="Ideas">💡 <span>Ideas</span></a>
    <a class="tab" href="#week" data-tab="week" title="What’s on">🎟️ <span>What’s on</span></a>
    <a class="tab" href="#activities" data-tab="activities" title="Activities">🎮 <span>Activities</span></a>
    <a class="tab" href="#memories" data-tab="memories" title="Memories">📷 <span>Memories</span></a>
  </nav>
  <button class="sync-pill" id="syncPill" type="button"></button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙︎</button>
</header>

<main id="view" tabindex="-1"></main>

<button class="poop-fab" id="poopFab" aria-label="Send a toot" title="…"><span aria-hidden="true">💨</span><span class="lf-count" id="poopCount" aria-live="polite" hidden></span></button>
<button class="love-fab" id="loveFab" aria-label="Say I love you" title="Tap as many times as you like"><span class="lf-heart" aria-hidden="true">💖</span><span class="lf-text">I love you</span><span class="lf-count" id="loveCount" aria-live="polite" hidden></span></button>
<div class="love-fx" id="loveFx" aria-hidden="true"></div>
<!-- A label, not a button: the tap opens the camera natively, which iPhones trust more than a scripted click. -->
<label class="fab" id="captureFab" for="cameraInput" role="button" tabindex="0" aria-label="Take a photo" title="Take a photo">📸</label>
<input type="file" id="photoInput" class="file-input" accept="image/*" multiple>
<input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">

<dialog id="modal" class="modal"></dialog>
<dialog id="lightbox" class="lightbox">
  <button class="lb-close" data-lb="close" aria-label="Close">✕</button>
  <button class="lb-nav prev" data-lb="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" data-lb="next" aria-label="Next">›</button>
  <div class="lb-bar"><span id="lbCap"></span><span class="lb-btns"><button class="btn small ghost" data-lb="play" id="lbPlay">▶ Play</button><button class="btn small" data-lb="save">⬇ Save</button><button class="btn small ghost" data-lb="saveall" id="lbSaveAll">Save all</button><button class="btn small ghost" data-lb="delete">Remove</button></span></div>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>

</body>
</html>
