<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hangouts</title>
<meta name="description" content="An unreasonably over-engineered app for planning dates and keeping the memories.">
<meta name="theme-color" content="#141018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hangouts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" integrity="sha384-sPwMflxqfAN+Q5mvlkLmHiX3PORGbZSXHiSGPTXT9VHCD/AB+b+r+vJWsqprv+7k" crossorigin="anonymous" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>

<div id="boot" class="overlay boot" hidden>
  <pre class="term" id="bootLog"></pre>
  <div class="bar"><i id="bootBar"></i></div>
  <p class="hint">tap to skip</p>
</div>

<div id="lock" class="overlay lock" hidden>
  <form class="lock-card" id="lockForm">
    <div class="lock-icon" aria-hidden="true">🔐</div>
    <h1>sudo unlock --heart</h1>
    <p class="muted">Everything here is end-to-end encrypted. Enter the passphrase you two share.</p>
    <input type="password" id="lockPass" autocomplete="current-password" placeholder="passphrase" required>
    <button class="btn primary" type="submit">Unlock</button>
    <p class="err" id="lockErr" role="alert"></p>
    <button class="linkish" type="button" id="lockSkip">continue offline (this device only)</button>
  </form>
</div>

<header class="topbar">
  <a class="brand" href="#ask"><span class="heart">❤</span> hangouts<span class="caret">_</span></a>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <a class="tab" href="#ask" data-tab="ask" role="tab"><span class="ext ts">TS</span>ask.tsx</a>
    <a class="tab" href="#calendar" data-tab="calendar" role="tab"><span class="ext cal">📅</span>calendar.ts</a>
    <a class="tab" href="#plans" data-tab="plans" role="tab"><span class="ext yml">!</span>plans.yml</a>
    <a class="tab" href="#archive" data-tab="archive" role="tab"><span class="ext log">≡</span>archive.log</a>
  </nav>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="config.json">⚙</button>
</header>

<main id="view" tabindex="-1"></main>

<button class="fab" id="captureFab" aria-label="Capture a moment" title="Capture a moment">📸</button>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<footer class="statusbar" id="statusbar"></footer>

<dialog id="modal" class="modal"></dialog>
<dialog id="lightbox" class="lightbox">
  <button class="lb-close" data-lb="close" aria-label="Close">✕</button>
  <button class="lb-nav prev" data-lb="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" data-lb="next" aria-label="Next">›</button>
  <div class="lb-bar"><span id="lbCap"></span><button class="btn small ghost" data-lb="delete">Remove photo</button></div>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>

</body>
</html>
